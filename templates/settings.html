<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root.light {
            --bg-primary: #FFFDFB;
            --bg-secondary: #FDE4D2;
            --bg-accent: #FFF4EB;
            --color-btn: #2D3E50;
            --color-btn-hover: #0B0F1C;
            --color-card: #FFF4EB;
            --color-text: #1C1C1E;
            --color-muted: #6B6B6D;
            --color-white: #FFFFFF;
            --color-border: #E4DAD1;
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            --radius: 16px;
            --color-icon: #00C08B;
            --color-primary: #FF7849;
            --color-accent: #2D3E50;
            --color-progress: #00C08B;
        }
        :root {
            --bg-primary: #0B0F1C;
            --bg-secondary: #1E2639;
            --bg-accent: #2C3E50;
            --color-btn: #2C3E50;
            --color-btn-hover: #0B0F1C;
            --color-card: #2C3E50;
            --color-text: #F4F4F4;
            --color-muted: #AAB0BC;
            --color-white: #FFFFFF;
            --color-border: #474545;
            --color-primary: #FF7849;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --color-icon: #00C08B;
            --radius: 16px;
            --color-progress: #00C08B;
        }
        html, body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-secondary);
            color: var(--color-text);
            min-height: 100vh;
        }
        body {
            margin: 0;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        header {
            background: var(--bg-accent);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
            padding: 0 1.5rem;
            max-width: 1180px;
            margin: 0 auto;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--color-text);
            font-size: 2rem;
            cursor: pointer;
            padding: 8px;
            z-index: 200;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--color-text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--color-primary);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .toggle-mode {
            padding: 8px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-text);
        }
        /* Tabs */
        .settings-tabs {
            display: flex;
            gap: 1.5rem;
            margin: 2.5rem 0 2rem 0;
            border-bottom: 1.5px solid var(--color-border);
            overflow-x: auto;
        }
        .settings-tab {
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--color-muted);
            padding: 0.7rem 1.2rem 1rem 1.2rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            transition: color 0.2s, border 0.2s;
        }
        .settings-tab.active, .settings-tab:hover {
            color: var(--color-primary);
            border-bottom: 3px solid var(--color-primary);
            background: none;
        }
        /* Cards */
        .settings-card {
            background: var(--bg-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2rem 1.5rem 2rem;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            transition: box-shadow 0.2s;
        }
        .settings-card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }
        .settings-form label {
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: var(--color-text);
            display: block;
        }
        .settings-form input[type="text"],
        .settings-form input[type="email"],
        .settings-form input[type="password"],
        .settings-form input[type="tel"],
        .settings-form select {
            width: 80%;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            background: var(--bg-secondary);
            color: var(--color-text);
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        .settings-form input:focus,
        .settings-form select:focus {
            border: 1.5px solid var(--color-primary);
        }
        .settings-form .avatar-upload {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }
        .avatar-preview {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--color-icon);
            overflow: hidden;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.08);
        }
        .settings-form .btn {
            background: linear-gradient(90deg, var(--color-primary) 60%, var(--color-accent) 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 2px 12px 0 rgba(255,120,73,0.08);
            margin-top: 0.5rem;
        }

        .settings-form .btn:hover {
            background: linear-gradient(90deg, var(--color-accent) 60%, var(--color-primary) 100%);
            transform: translateY(-2px) scale(1.04);
        }
        .settings-form .switch-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .switch-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            color: var(--color-text);
            cursor: pointer;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--color-border);
            border-radius: 24px;
            transition: background 0.2s;
        }
        .switch input:checked + .slider {
            background: var(--color-progress);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .switch input:checked + .slider:before {
            transform: translateX(20px);
        }
        .settings-form .form-row {
            display: flex;
            gap: 1rem;
        }
        .settings-form .form-row > * {
            flex: 1 1 0;
        }
        .settings-form .select-group {
            margin-bottom: 1rem;
        }
        .settings-form .select-group label {
            margin-bottom: 0.3rem;
        }
        .settings-form .select-group select {
            margin-bottom: 0;
        }
        .settings-form .theme-toggle-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .settings-form .theme-toggle-row .theme-toggle-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--color-primary);
            cursor: pointer;
            margin-left: 0.5rem;
        }
        .settings-form .theme-toggle-row .theme-toggle-btn.active {
            color: var(--color-progress);
        }
        .settings-form .danger-btn {
            background: linear-gradient(90deg, #e53935 60%, #ff7849 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s, transform 0.2s;
        }
        .settings-form .danger-btn:hover {
            background: linear-gradient(90deg, #ff7849 60%, #e53935 100%);
            transform: translateY(-2px) scale(1.04);
        }
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--color-card);
            color: var(--color-text);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 1rem 1.5rem;
            font-weight: 600;
            z-index: 9999;
            display: none;
            align-items: center;
            gap: 0.7rem;
        }
        .toast.success { color: var(--color-progress);}
        .toast.error { color: #e53935;}
        /* Responsive */
        @media (max-width: 700px) {
            .settings-card {
                padding: 1.2rem 0.7rem 1rem 0.7rem;
            }
            .settings-tabs {
                gap: 0.5rem;
                font-size: 0.97rem;
            }
        }
        @media (max-width: 768px) {
        .mobile-menu-btn {
            display: block;
        }

        .nav-links {
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            background: var(--bg-accent);
            padding: 20px;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.3s ease;
            visibility: hidden;
        }

        .nav-links.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
            box-shadow: var(--shadow);
        }

        .nav-links a {
            font-size: 18px;
            width: 100%;
            text-align: center;
            padding: 12px;
        }

        .nav-links a:hover {
            background: var(--bg-secondary);
            border-radius: var(--radius);
        }
    }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-bar" style="max-width:1180px;margin:0 auto;padding:0 1.5rem;">
            <a href="{{ url_for('home') }}" class="logo">FixIt</a>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Úvod</a></li>
                <li><a href="{{ url_for('price_list') }}">Ceník</a></li>
                <li><a href="{{ url_for('my_repairs') }}">Moje opravy</a></li>
                <li><a href="{{ url_for('repair_guides') }}">Najít servisy</a></li>
                <li><a href="{{ url_for('about_us') }}">O nás</a></li>
            </ul>
            <div class="nav-right">
                <button class="toggle-mode" id="themeToggleBtn">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="profile-dropdown">
                    <button class="profile-btn" onclick="toggleDropdown()" style="padding:0;">
                        {% if user.avatar %}
                            <img src="{{ user.avatar }}" alt="Profil" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
                        {% else %}
                            <i class="fas fa-user"></i>
                        {% endif %}
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="{{ url_for('dashboard') }}"><i class="fas fa-user"></i> Profil</a>
                        <a href="{{ url_for('settings') }}"><i class="fas fa-cog"></i> Nastavení</a>
                        <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Odhlásit se</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="settings-tabs" id="settingsTabs">
                <button class="settings-tab active" data-tab="all"><i class="fas fa-cog"></i> Nastavení</button>
            </div>
            <section class="settings-card settings-section" id="tab-all">
                <!-- Profile Settings -->
                <h2><i class="fas fa-user"></i> Nastavení profilu</h2>
                <form class="settings-form" id="profileForm" method="post" action="{{ url_for('update_profile') }}" autocomplete="off">
                    <div class="avatar-upload">
                        <div class="avatar-preview" id="avatarPreview">
                            {% if user.avatar %}
            <img src="{{ user.avatar }}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
        {% else %}
            <i class="fas fa-user"></i>
        {% endif %}
                        </div>
                        <div>
                            <label for="avatarInput" style="margin-bottom:0.2rem;">Avatar (volitelné)</label>
                            <input type="file" id="avatarInput" accept="image/*" style="margin-bottom:0.2rem;">
                        </div>
                    </div>
                    <label for="displayName">Jméno</label>
                    <input type="text" id="displayName" name="displayName" required value="{{ user.username }}">
                    <label for="email">Emailová adresa</label>
                    <input type="email" id="email" name="email" required value="{{ user_email }}" readonly>
                    <label for="phone">Telefonní číslo</label>
                    <input type="tel" id="phone" name="phone" pattern="^\+?\d{7,15}$" value="{{ user.phone }}" placeholder="+420123456789">
                    <button type="submit" class="btn">Uložit změny</button>
                </form>
                <!-- Password Change -->
                <hr style="margin:2rem 0;border:none;border-top:1px solid var(--color-border);">
                <h2><i class="fas fa-lock"></i> Změna hesla</h2>
                <form class="settings-form" id="passwordForm" method="post" action="{{ url_for('change_password') }}" autocomplete="off">
                    <label for="oldPassword">Staré heslo</label>
                    <input type="password" id="oldPassword" name="oldPassword" required>
                    <label for="newPassword">Nové heslo</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6">
                    <label for="confirmPassword">Potvrďte nové heslo</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                    <button type="submit" class="btn">Aktualizovat heslo</button>
                </form>
                <!-- Account Actions -->
                <hr style="margin:2rem 0;border:none;border-top:1px solid var(--color-border);">
                <h2><i class="fas fa-user-cog"></i> Akce účtu</h2>
                <form class="settings-form" id="accountForm">
                    <button type="button" class="btn" id="logoutBtn" style="margin-bottom:1rem;"><i class="fas fa-sign-out-alt"></i> Odhlásit se</button>
                    <button type="button" class="danger-btn" id="deleteAccountBtn"><i class="fas fa-trash"></i> Smazat můj účet</button>
                </form>
            </section>
        </div>
        <!-- Delete Account Modal -->
        <div id="deleteModal" style="display:none;position:fixed;z-index:9999;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);align-items:center;justify-content:center;">
            <div style="background:var(--color-card);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.18);padding:2rem 1.5rem;max-width:350px;width:95%;margin:auto;display:flex;flex-direction:column;gap:1rem;">
                <h2 style="font-size:1.2rem;font-weight:700;color:var(--color-primary);margin-bottom:0.5rem;"><i class="fas fa-exclamation-triangle" style="color:#e53935"></i> Potvrďte smazání</h2>
                <div style="color:var(--color-muted);font-size:1rem;margin-bottom:0.5rem;">Opravdu chcete smazat svůj účet? Tato akce je nevratná.</div>
                <div style="display:flex;gap:1rem;justify-content:flex-end;">
                    <button type="button" class="btn" id="cancelDeleteBtn" style="background:var(--color-accent);color:#fff;">Zrušit</button>
                    <button type="button" class="danger-btn" id="confirmDeleteBtn">Smazat</button>
                </div>
            </div>
        </div>
    </main>
    <div class="dropdown-menu" id="dropdownMenu">
        <a href="{{ url_for('dashboard') }}"><i class="fas fa-user"></i> Profil</a>
        <a href="{{ url_for('settings') }}"><i class="fas fa-cog"></i> Nastavení</a>
        <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Odhlásit se</a>
    </div>
    <script>
        document.getElementById('mobileMenuBtn').addEventListener('click', function() {
        const navLinks = document.querySelector('.nav-links');
        const icon = this.querySelector('i');
        
        navLinks.classList.toggle('active');
        icon.classList.toggle('fa-bars');
        icon.classList.toggle('fa-times');
    });

    // Close menu when clicking outside
    document.addEventListener('click', function(e) {
        const navLinks = document.querySelector('.nav-links');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        
        if (!navLinks.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
            navLinks.classList.remove('active');
            mobileMenuBtn.querySelector('i').classList.replace('fa-times', 'fa-bars');
        }
    });
        // Theme toggle in header
        document.getElementById('themeToggleBtn').addEventListener('click', function() {
            const html = document.documentElement;
            const icon = this.querySelector('i');
            const isLight = html.classList.contains('light');
            
            html.classList.toggle('light', !isLight);
            html.classList.toggle('dark', isLight);
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
            localStorage.setItem('theme', isLight ? 'dark' : 'light'); // Saves theme
        });
        
        // Load saved theme on page load (this IIFE handles initial load for header button)
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const html = document.documentElement;
            const icon = document.querySelector('#themeToggleBtn i');
            
            html.classList.toggle('light', savedTheme === 'light');
            html.classList.toggle('dark', savedTheme === 'dark');
            if (icon) {
                icon.classList.toggle('fa-moon', savedTheme === 'light');
                icon.classList.toggle('fa-sun', savedTheme === 'dark');
            }
        })();
        
        // Tabs logic (only one tab)
        document.querySelectorAll('.settings-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.settings-section').forEach(sec => sec.style.display = 'none');
                document.getElementById('tab-' + this.dataset.tab).style.display = '';
            });
        });
        // Show the only tab by default
        document.getElementById('tab-all').style.display = '';
        // Avatar upload
        document.getElementById('avatarInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    const preview = document.getElementById('avatarPreview');
    
    if (file) {
        // Show preview
        const reader = new FileReader();
        reader.onload = function(ev) {
            preview.innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        };
        reader.readAsDataURL(file);

        // Upload to server
        const formData = new FormData();
        formData.append('avatar', file);

        try {
            const response = await fetch('/api/update-profile', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                showToast('Avatar byl úspěšně aktualizován!', 'success');
            } else {
                showToast(data.msg || 'Nepodařilo se aktualizovat avatar', 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Chyba při aktualizaci avataru', 'error');
        }
    }
});
        // Profile form validation & AJAX
        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const displayName = document.getElementById('displayName').value;
            const phone = document.getElementById('phone').value;

            if (!displayName) {
                alert('Jméno je povinné');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('displayName', displayName);
                formData.append('phone', phone);

                const response = await fetch('/update_profile', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    alert('Profil byl úspěšně aktualizován!');
                } else {
                    alert(data.message || 'Nepodařilo se aktualizovat profil');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Chyba při aktualizaci profilu');
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                alert('Všechna pole jsou povinná');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('Hesla se neshodují');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('oldPassword', oldPassword);
                formData.append('newPassword', newPassword);

                const response = await fetch('/change_password', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    alert('Heslo bylo úspěšně aktualizováno!');
                    this.reset();
                } else {
                    alert(data.message || 'Nepodařilo se aktualizovat heslo');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Chyba při aktualizaci hesla');
            }
        });
        // Notifications form
        document.getElementById('notificationsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showToast('Uložení preferencí notifikací bylo úspěšné!', 'success');
        });
        // Language form
        document.getElementById('languageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showToast('Uložení jazyka a regionu bylo úspěšné!', 'success');
        });
        // Theme toggle with localStorage consistency (for settings page internal buttons)
        function setTheme(theme) {
            const html = document.documentElement;
            if (theme === 'light') {
                html.classList.add('light');
                html.classList.remove('dark');
            } else {
                html.classList.add('dark');
                html.classList.remove('light');
            }
            localStorage.setItem('theme', theme); // Saves theme
            updateThemeButtons(); // Updates buttons on settings page
            updateHeaderThemeIcon(); // Updates header icon
        }
        function updateThemeButtons() {
            const html = document.documentElement;
            const lightModeBtn = document.getElementById('lightModeBtn');
            const darkModeBtn = document.getElementById('darkModeBtn');
            if (lightModeBtn) lightModeBtn.classList.toggle('active', html.classList.contains('light'));
            if (darkModeBtn) darkModeBtn.classList.toggle('active', html.classList.contains('dark'));
        }
        function updateHeaderThemeIcon() {
            const headerIcon = document.querySelector('#themeToggleBtn i');
            if (headerIcon) {
                const isLight = document.documentElement.classList.contains('light');
                headerIcon.classList.toggle('fa-moon', isLight);
                headerIcon.classList.toggle('fa-sun', !isLight);
            }
        }
        const lightModeBtn = document.getElementById('lightModeBtn');
        const darkModeBtn = document.getElementById('darkModeBtn');

        if (lightModeBtn) {
            lightModeBtn.addEventListener('click', function() {
                setTheme('light');
            });
        }
        if (darkModeBtn) {
            darkModeBtn.addEventListener('click', function() {
                setTheme('dark');
            });
        }
        
        // Load theme from localStorage on page load and apply to settings buttons
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            setTheme(theme); // This ensures settings page buttons and header icon are synced on load
        })();
        // Account actions
        document.getElementById('logoutBtn').addEventListener('click', function() {
            // Změna - přidání fetch požadavku s redirect
            fetch('/logout')
                .then(() => {
                    window.location.href = "/";  // Redirect na hlavní stránku
                })
                .catch(err => {
                    console.error("Logout error:", err);
                    window.location.href = "/"; // Pokus o redirect i při chybě
                });
        });
        // Delete account modal
        const deleteModal = document.getElementById('deleteModal');
        document.getElementById('deleteAccountBtn').addEventListener('click', function() {
            deleteModal.style.display = 'flex';
        });
        document.getElementById('cancelDeleteBtn').addEventListener('click', function() {
            deleteModal.style.display = 'none';
        });
        document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
            deleteModal.style.display = 'none';
            showToast('Účet byl smazán!', 'success');
            // window.location.href = 'signup.html';
        });
        // Toast
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + (type || '');
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 2200);
        }
    </script>
</body>
</html>
